name: Release
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. 2.10.0)'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.7'
          channel: 'stable'
          cache: true

      - name: Resolve dependencies
        working-directory: yuuna
        run: flutter pub get

      - name: Regenerate Isar/dart_mappable code
        working-directory: yuuna
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Generate debug keystore
        run: |
          mkdir -p yuuna/android/keys
          keytool -genkey -noprompt \
            -keystore yuuna/android/keys/debug.keystore \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10950 \
            -dname "CN=Android Debug, O=Android, C=US"

      - name: Build split-per-ABI release APKs
        working-directory: yuuna
        run: flutter build apk --release --split-per-abi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: yuuna/build/app/outputs/apk/release/jidoujisho_yuuna_*.apk
