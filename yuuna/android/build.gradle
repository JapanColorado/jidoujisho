

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://jitpack.io" }
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        maven { url 'https://maven.aliyun.com/repository/apache-snapshots' }
    }

    configurations.all {
        resolutionStrategy {
            // Force AndroidX versions compatible with AGP 8.2.1
            force 'androidx.browser:browser:1.7.0'
            force 'androidx.activity:activity:1.8.2'
            force 'androidx.core:core-ktx:1.13.1'
            force 'androidx.core:core:1.13.1'

            // Force Kotlin stdlib/coroutines compatible with Kotlin 2.1.0 controller
            force "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.0"
            force "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"
            force "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.9.0"
            force "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
        }
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

ext {
    kotlin_version = '2.1.0'
    flutterFFmpegPackage = "full-gpl-lts"
}

subprojects {
    def configureLibraryAndroid = {
        if (project.plugins.hasPlugin("com.android.library")) {
            project.android {
                 compileSdkVersion 36
                 ndkVersion "27.0.12077973"
                 compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }

                // AGP 8 requires every module to declare a namespace.
                // Many older Flutter plugins still rely on the legacy
                // `package` attribute in AndroidManifest.xml — derive a
                // namespace from that when the plugin author has not migrated.
                if (namespace == null) {
                    def manifestFile = file("src/main/AndroidManifest.xml")
                    if (manifestFile.exists()) {
                        def manifest = new XmlSlurper().parse(manifestFile)
                        def pkg = manifest.@package?.text()
                        if (pkg) {
                            namespace = pkg
                        }
                    }
                    if (namespace == null && project.group) {
                        namespace = project.group.toString()
                    }
                }
            }
        }
        if (project.plugins.hasPlugin("kotlin-android")) {
            project.android {
                kotlinOptions {
                    jvmTarget = "17"
                }
            }
        }
    }

    if (project.state.executed) {
        configureLibraryAndroid()
    } else {
        project.afterEvaluate(configureLibraryAndroid)
    }
}
