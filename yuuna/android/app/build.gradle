plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}


def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Release versioning, the same locally and in CI: versionCode is the commit count and versionName
// is "<major>.<minor>.<count>", with major.minor taken from pubspec.yaml's `version:` (bump it there
// by hand; its patch and +build number are ignored). Without full git history (no git, or a
// shallow clone) the pubspec values are used as they are, which CI refuses: a release must never
// go out with a versionCode that is not the commit count.
def gitOutput = { List<String> args ->
    try {
        def result = providers.exec {
            commandLine(['git'] + args)
            workingDir rootProject.projectDir
            ignoreExitValue true
        }
        return result.result.get().exitValue == 0 ? result.standardOutput.asText.get().trim() : null
    } catch (Exception ignored) {
        return null
    }
}
if (gitOutput(['rev-parse', '--is-shallow-repository']) == 'false') {
    def commitCount = gitOutput(['rev-list', '--count', 'HEAD'])
    if (commitCount?.isInteger()) {
        def base = flutterVersionName.tokenize('.').take(2).join('.')
        flutterVersionCode = commitCount
        flutterVersionName = "${base}.${commitCount}"
    }
} else if (System.getenv('CI')) {
    throw new GradleException('CI build without full git history: check out with fetch-depth: 0 so versionCode is the commit count')
}

// Release signing: android/key.properties (gitignored; CI writes it from the repository secrets)
// names the release keystore. When it exists it signs both release and debug builds, so a local
// debug build installs over a release from GitHub. Without it both fall back to the debug keystore.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}


android {
    namespace "app.arianneorpilla.yuuna"
    compileSdkVersion 36
    ndkVersion "27.0.12077973"

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "app.arianneorpilla.yuuna"
        minSdkVersion 24
        targetSdkVersion 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    // Pin a project-local debug keystore so signatures stay stable across
    // builds. Android's default `~/.android/debug.keystore` is silently
    // regenerated by various tooling (Android Studio, gradle daemon
    // upgrades), which causes INSTALL_FAILED_UPDATE_INCOMPATIBLE on every
    // rotation. Used for both build types when there is no key.properties.
    signingConfigs {
        debug {
            keyAlias 'androiddebugkey'
            keyPassword 'android'
            storeFile file('../keys/debug.keystore')
            storePassword 'android'
        }
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    def appSigningConfig = keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug

    buildTypes {
      release {
         minifyEnabled true
         shrinkResources true
         signingConfig appSigningConfig
      }

      debug {
        signingConfig appSigningConfig
      }
   }

    packagingOptions {
       // Fixes duplicate libraries build issue, 
       // when your project uses more than one plugin that depend on C++ libs.
        pickFirst 'lib/**/libc++_shared.so'
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def appName = "jidoujisho_yuuna"
            def buildType = variant.buildType.name
            def architecture = output.getFilter(com.android.build.OutputFile.ABI)
            def newName

            if ("${architecture}" == "arm64-v8a") {
                architecture = "arm64"
            } else if ("${architecture}" == "armeabi-v7a") {
                architecture = "armeabi"
            }

            if ("${architecture}" == "null") {
                if (buildType == 'debug') {
                    newName = "${appName}_${defaultConfig.versionName}-debug.apk"
                } else {
                    newName = "${appName}_${defaultConfig.versionName}.apk"
                }
                
                output.versionCodeOverride = (100 * project.android.defaultConfig.versionCode)
            } else {
                if (buildType == 'debug') {
                    newName = "${appName}_${defaultConfig.versionName}-${architecture}-debug.apk"
                } else {
                    newName = "${appName}_${defaultConfig.versionName}-${architecture}.apk"
                }

                def offset
                if (architecture == "armeabi") {
                    offset = 1
                } else if (architecture == "arm64") {
                    offset = 2
                } else if (architecture == "x86_64") {
                    offset = 3
                }

                outputFileName = newName
                output.versionCodeOverride = (100 * project.android.defaultConfig.versionCode) + offset
            }
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.0"
    implementation 'com.github.ankidroid:Anki-Android:2.17alpha14'
    implementation 'com.github.umair13adil:RxLogs:v1.0.18'
}

configurations.all {
    resolutionStrategy {
        // Force AndroidX versions compatible with AGP 8.2.1
        force 'androidx.browser:browser:1.7.0'
        force 'androidx.activity:activity:1.8.2'
        force 'androidx.core:core-ktx:1.13.1'
        force 'androidx.core:core:1.13.1'
        // Force Kotlin stdlib/coroutines compatible with Kotlin 2.1.0 controller
        force "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.1.0"
        force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.1.0"
        force "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0"
        force "org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.9.0"
        force "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0"
    }
}
